services:
  pgdb:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10



  migrate:
    build:
      context: ./backend
      target: builder
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      pgdb:
        condition: service_healthy




  backend:
    build:
      context: ./backend
      args:
        UPLOAD_DIR: ${UPLOAD_DIR}
    restart: always
    environment:
      PORT: ${BACKEND_PORT}
      DATABASE_URL: ${DATABASE_URL}
      UPLOAD_DIR: ${UPLOAD_DIR}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      REFRESH_TOKEN_EXPIRES_IN: ${REFRESH_TOKEN_EXPIRES_IN}
      REFRESH_COOKIE_PATH: ${REFRESH_COOKIE_PATH}
      NODE_ENV: ${NODE_ENV:-production}
    depends_on:
      pgdb:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${PORT}/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - uploads:${UPLOAD_DIR}



  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
        NEXT_PUBLIC_TLDRAW_LICENSE_KEY: ${TLDRAW_API_KEY:-}
    restart: always
    environment:
      PORT: ${FRONTEND_PORT}
      # Server rendering goes through nginx over HTTPS, like the browser.
      INTERNAL_API_URL: https://nginx/api
      # Lets Node trust the self-signed certificate nginx presents.
      NODE_EXTRA_CA_CERTS: /certs/cert.pem
    volumes:
      # key.pem is root-only (0600), so the nextjs user can read only cert.pem.
      - certs:/certs:ro
    depends_on:
      backend:
        condition: service_healthy
      certs:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${PORT}/ > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  certs:
    image: alpine/openssl
    entrypoint: ["sh"]
    command: ["/gen-cert.sh"]
    volumes:
      - certs:/certs
      - ./nginx/cert/gen-cert.sh:/gen-cert.sh:ro
    restart: "no"

  nginx:
    image: nginx:1.27-alpine
    ports: 
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certs:/etc/nginx/certs:ro
    depends_on:
      frontend:
        condition: service_healthy
      certs:
        condition: service_completed_successfully
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5


volumes:
  pgdata:
  uploads:
  certs:
