services:
  pgdb:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10



  migrate:
    build:
      context: ./backend
      target: builder
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      pgdb:
        condition: service_healthy




  backend:
    build:
      context: ./backend
      args:
        UPLOAD_DIR: ${UPLOAD_DIR}
    restart: always
    environment:
      PORT: ${BACKEND_PORT:-3001}
      DATABASE_URL: ${DATABASE_URL}
      UPLOAD_DIR: ${UPLOAD_DIR}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      REFRESH_COOKIE_PATH: ${REFRESH_COOKIE_PATH:-/api/auth/refresh}
      REFRESH_EXPIRES_IN_DAYS: ${REFRESH_EXPIRES_IN_DAYS:-30}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      NODE_ENV: ${NODE_ENV:-production}
    depends_on:
      pgdb:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${PORT}/ > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - uploads:${UPLOAD_DIR}



  frontend:
    build:
      context: ./frontend
      args:
        # Same origin through nginx: no CORS, and the refresh cookie can stay
        # SameSite=Lax.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
        # `:-` so an unset variable stays unset instead of becoming "".
        NEXT_PUBLIC_ENABLE_MOCKS: ${NEXT_PUBLIC_ENABLE_MOCKS:-false}
        NEXT_PUBLIC_SYNC_MODE: ${NEXT_PUBLIC_SYNC_MODE:-local}
        NEXT_PUBLIC_SYNC_URL: ${NEXT_PUBLIC_SYNC_URL:-}
    restart: always
    environment:
      PORT: ${FRONTEND_PORT:-3000}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${PORT}/ > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s



  proxy:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "${PROXY_PORT:-8080}:80"
    environment:
      FRONTEND_PORT: ${FRONTEND_PORT:-3000}
      BACKEND_PORT: ${BACKEND_PORT:-3001}
      NGINX_ENVSUBST_FILTER: "^(FRONTEND|BACKEND)_PORT$$"
    volumes:
      - ./nginx/upgrade.conf:/etc/nginx/conf.d/00-upgrade.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s


volumes:
  pgdata:
  uploads:
