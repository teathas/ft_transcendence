map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    server_tokens off;  #security measure, it hides nginx's version
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}

server {
    server_tokens off;  #security measure, it hides nginx's version
    listen 443 ssl;
    server_name localhost;
    client_max_body_size 10m;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    #Security headers
    add_header X-Content-Type-Options "nosniff" always;                                #MIME sniffing, makes the browser TRUST 'content-type' i send
    add_header X-Frame-Options "SAMEORIGIN" always;                                          #defence againt clickjacking (<iframe>)
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;               #makes (referer) show only which site the visitor came from never the path or invite code, and my own pages still get full referrers.
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;   #turn off what study room never uses
    add_header Strict-Transport-Security "max-age=300" always;                         #



    location / {
        proxy_pass http://frontend:3000;

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    # The live whiteboard: a websocket to the API. Declared before /api/, which
    # would otherwise take it without the upgrade headers.
    location /api/sync/ {
        proxy_pass http://backend:3001/sync/;

        proxy_http_version 1.1;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         $connection_upgrade;

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass http://backend:3001/;

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    location /socket.io/ {
        proxy_pass http://backend:3001;

        proxy_http_version 1.1;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         $connection_upgrade;

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
