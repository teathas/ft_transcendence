map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    server_tokens off;  #security measure, it hides nginx's version
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}

server {
    server_tokens off;  #security measure, it hides nginx's version
    listen 443 ssl;
    server_name localhost;
    # A 10 MB file plus its multipart envelope is a little over 10 MB.
    client_max_body_size 12m;

    # Docker's own DNS. Upstreams are given as variables below so their names
    # are looked up again as containers are recreated: with a fixed name nginx
    # keeps the address it saw at start and answers 502 after a rebuild.
    resolver 127.0.0.11 valid=10s ipv6=off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    location / {
        set $frontend http://frontend:3000;
        proxy_pass $frontend;

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    # The live whiteboard: a websocket to the API. Declared before /api/, which
    # would otherwise take it without the upgrade headers.
    location /api/sync/ {
        set $backend http://backend:3001;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;

        proxy_http_version 1.1;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         $connection_upgrade;

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        set $backend http://backend:3001;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
    }

    location /socket.io/ {
        set $backend http://backend:3001;
        proxy_pass $backend;

        proxy_http_version 1.1;
        proxy_set_header Upgrade            $http_upgrade;
        proxy_set_header Connection         $connection_upgrade;

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
