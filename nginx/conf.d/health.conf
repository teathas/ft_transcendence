# Used only by the docker healthcheck. Bound to the container's own loopback,
# so neither the host nor the other containers can reach it.
server {
    server_tokens off;
    listen 127.0.0.1:8080;
    access_log off;     #the healthcheck runs every 10s, keep it out of the logs

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}
